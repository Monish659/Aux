<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0604"/>
      <stop offset="55%" stop-color="#120c06"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>

    <!-- Amber core glow -->
    <radialGradient id="amberGlow" cx="42%" cy="50%" r="45%">
      <stop offset="0%"  stop-color="#d4701a" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#b85200" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0604" stop-opacity="0"/>
    </radialGradient>

    <!-- Right-side dim -->
    <radialGradient id="rightGlow" cx="85%" cy="50%" r="30%">
      <stop offset="0%"  stop-color="#8b3f0a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0604" stop-opacity="0"/>
    </radialGradient>

    <!-- Speed line clip (full canvas) -->
    <clipPath id="fullClip">
      <rect width="2560" height="1440"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="2560" height="1440" fill="url(#bgGrad)"/>

  <!-- Ambient glows -->
  <rect width="2560" height="1440" fill="url(#amberGlow)"/>
  <rect width="2560" height="1440" fill="url(#rightGlow)"/>

  <!-- Speed lines radiating from left-center -->
  <g clip-path="url(#fullClip)" opacity="0.07">
    <!-- Each line radiates from roughly x=480, y=720 -->
    <line x1="480" y1="720" x2="2560" y2="0"   stroke="#d4701a" stroke-width="1.2"/>
    <line x1="480" y1="720" x2="2560" y2="160"  stroke="#d4701a" stroke-width="0.9"/>
    <line x1="480" y1="720" x2="2560" y2="340"  stroke="#b85200" stroke-width="1.4"/>
    <line x1="480" y1="720" x2="2560" y2="510"  stroke="#d4701a" stroke-width="0.8"/>
    <line x1="480" y1="720" x2="2560" y2="640"  stroke="#d4701a" stroke-width="1.0"/>
    <line x1="480" y1="720" x2="2560" y2="760"  stroke="#b85200" stroke-width="1.6"/>
    <line x1="480" y1="720" x2="2560" y2="880"  stroke="#d4701a" stroke-width="1.0"/>
    <line x1="480" y1="720" x2="2560" y2="980"  stroke="#d4701a" stroke-width="0.8"/>
    <line x1="480" y1="720" x2="2560" y2="1100" stroke="#b85200" stroke-width="1.3"/>
    <line x1="480" y1="720" x2="2560" y2="1260" stroke="#d4701a" stroke-width="0.9"/>
    <line x1="480" y1="720" x2="2560" y2="1440" stroke="#d4701a" stroke-width="1.1"/>
    <line x1="480" y1="720" x2="0"    y2="0"    stroke="#d4701a" stroke-width="0.8"/>
    <line x1="480" y1="720" x2="0"    y2="1440" stroke="#d4701a" stroke-width="0.8"/>
    <line x1="480" y1="720" x2="800"  y2="0"    stroke="#b85200" stroke-width="0.7"/>
    <line x1="480" y1="720" x2="1200" y2="0"    stroke="#d4701a" stroke-width="0.6"/>
    <line x1="480" y1="720" x2="800"  y2="1440" stroke="#b85200" stroke-width="0.7"/>
    <line x1="480" y1="720" x2="1200" y2="1440" stroke="#d4701a" stroke-width="0.6"/>
  </g>

  <!-- Grain texture overlay (SVG feTurbulence) -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="overlay"/>
  </filter>
  <rect width="2560" height="1440" filter="url(#grain)" opacity="0.018"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- SAFE ZONE CONTENT: x 507–2053, y 509–932 (1546 × 423)    -->
  <!-- All critical content lives here                            -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Bull logo — left anchor of safe zone -->
  <image href="logo.svg" x="507" y="555" width="310" height="310"
         style="filter:invert(1) sepia(1) saturate(2) hue-rotate(10deg) brightness(1.1)"/>

  <!-- Thin amber rule above wordmark -->
  <rect x="860" y="618" width="56" height="2.5" rx="1.25" fill="#b85200"/>

  <!-- AUX wordmark -->
  <text x="860" y="750"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="178" font-weight="600" letter-spacing="-4"
        fill="#f5f0eb">AUX</text>

  <!-- Tagline -->
  <text x="864" y="820"
        font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="300" letter-spacing="6"
        fill="#f5f0eb" opacity="0.55">YOUR AUXILIARY TO SUCCEED</text>

  <!-- Subject pills -->
  <!-- Physics pill -->
  <rect x="864" y="862" width="160" height="44" rx="22"
        fill="none" stroke="#b85200" stroke-width="1.5" opacity="0.7"/>
  <text x="944" y="890"
        font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="500" letter-spacing="1.5"
        fill="#d4701a" text-anchor="middle" opacity="0.9">PHYSICS</text>

  <!-- Precalc pill -->
  <rect x="1042" y="862" width="244" height="44" rx="22"
        fill="none" stroke="#b85200" stroke-width="1.5" opacity="0.7"/>
  <text x="1164" y="890"
        font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="500" letter-spacing="1.5"
        fill="#d4701a" text-anchor="middle" opacity="0.9">PRECALCULUS</text>

  <!-- Free badge top-right of safe zone -->
  <rect x="1930" y="618" width="118" height="40" rx="20"
        fill="#b85200" opacity="0.18"/>
  <rect x="1930" y="618" width="118" height="40" rx="20"
        fill="none" stroke="#b85200" stroke-width="1.2" opacity="0.55"/>
  <text x="1989" y="645"
        font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="600" letter-spacing="2.5"
        fill="#d4701a" text-anchor="middle">FREE</text>

  <!-- Vertical rule between logo and text -->
  <rect x="840" y="618" width="1" height="310" rx="0.5" fill="#b85200" opacity="0.25"/>

  <!-- Bottom amber line accent -->
  <rect x="507" y="950" width="1546" height="1.5" rx="0.75" fill="#b85200" opacity="0.15"/>
</svg>
