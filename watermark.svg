<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="120" height="36" viewBox="0 0 120 36">
  <!-- Pill background -->
  <rect x="0" y="0" width="120" height="36" rx="6"
        fill="#0a0604" fill-opacity="0.45"/>

  <!-- Bull logo -->
  <image href="logo.svg" x="6" y="4" width="26" height="26"
         style="filter:invert(1) sepia(1) saturate(1.5) hue-rotate(10deg) brightness(1.2)"
         opacity="0.88"/>

  <!-- Amber divider -->
  <rect x="38" y="8" width="1" height="20" rx="0.5" fill="#b85200" opacity="0.5"/>

  <!-- AUX wordmark -->
  <text x="46" y="24"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="18" font-weight="600" letter-spacing="1.5"
        fill="#f5f0eb" fill-opacity="0.88">AUX</text>
</svg>
