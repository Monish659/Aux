<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0604"/>
      <stop offset="55%" stop-color="#120c06"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>

    <!-- Amber glow — now centered -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%"  stop-color="#d4701a" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#b85200" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0604" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple vignette at edges (matches website outer tone from shards) -->
    <radialGradient id="purpleVign" cx="50%" cy="50%" r="72%">
      <stop offset="58%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0030" stop-opacity="0.38"/>
    </radialGradient>

    <!-- Shard fill gradients (matching website palette) -->
    <linearGradient id="sf1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#481680" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="sf2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="sf3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b0f6e" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.26"/>
    </linearGradient>

    <clipPath id="fullClip"><rect width="2560" height="1440"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="2560" height="1440" fill="url(#bgGrad)"/>
  <rect width="2560" height="1440" fill="url(#amberGlow)"/>
  <rect width="2560" height="1440" fill="url(#purpleVign)"/>

  <!-- Speed lines radiating from center (like website bg) -->
