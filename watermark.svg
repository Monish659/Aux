<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="52" viewBox="0 0 200 52">
  <defs>
    <linearGradient id="wmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f0eb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f5f0eb" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Pill background -->
  <rect x="0" y="0" width="200" height="52" rx="8"
        fill="#0a0604" fill-opacity="0.42"/>

  <!-- Bull logo -->
  <image href="logo.svg" x="7" y="4" width="40" height="40"
         style="filter:invert(1) sepia(1) saturate(1.5) hue-rotate(10deg) brightness(1.2)"
         opacity="0.9"/>

  <!-- Amber divider -->
  <rect x="54" y="11" width="1" height="28" rx="0.5" fill="#b85200" opacity="0.5"/>

  <!-- AUX wordmark -->
  <text x="65" y="35"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="27" font-weight="600" letter-spacing="1.5"
        fill="url(#wmGrad)">AUX</text>

  <!-- URL -->
  <text x="65" y="46"
        font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif"
        font-size="7.5" font-weight="400" letter-spacing="1.8"
        fill="#f5f0eb" opacity="0.45">AUX-TUTORING.COM</text>
</svg>
